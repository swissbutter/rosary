<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Deep Luxurious Midnight Onyx Background -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#141c2b"/>
      <stop offset="50%" stop-color="#0b111c"/>
      <stop offset="100%" stop-color="#04060a"/>
    </radialGradient>

    <!-- Warm Champagne Gold Metallic Gradient -->
    <linearGradient id="goldGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#fff8e7"/>
      <stop offset="25%" stop-color="#f3d078"/>
      <stop offset="55%" stop-color="#c99d42"/>
      <stop offset="85%" stop-color="#e2b859"/>
      <stop offset="100%" stop-color="#9a7023"/>
    </linearGradient>

    <!-- Soft Rose-Gold / Amber Warm Gem Gradient -->
    <radialGradient id="gemGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffe8d6"/>
      <stop offset="35%" stop-color="#ddaa77"/>
      <stop offset="75%" stop-color="#885522"/>
      <stop offset="100%" stop-color="#442508"/>
    </radialGradient>

    <!-- Center Soft Radiant Aura -->
    <radialGradient id="centerAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(243, 208, 120, 0.22)"/>
      <stop offset="50%" stop-color="rgba(201, 157, 66, 0.08)"/>
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)"/>
    </radialGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full Square Luxury Onyx Background -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Center Soft Radiance -->
  <circle cx="256" cy="256" r="170" fill="url(#centerAura)"/>

  <!-- Delicate Metallic Cord Line -->
  <ellipse cx="256" cy="256" rx="142" ry="142" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.4" stroke-dasharray="8,6"/>

  <!-- 12 Spherical Luxury Rosary Beads -->
  <!-- Top Apex Gold Bead -->
  <g filter="url(#shadow)">
    <circle cx="256" cy="114" r="24" fill="url(#goldGrad)"/>
    <circle cx="248" cy="106" r="7" fill="#ffffff" opacity="0.75"/>
  </g>

  <g filter="url(#shadow)">
    <circle cx="327" cy="133" r="19" fill="url(#gemGrad)"/>
    <circle cx="321" cy="127" r="5" fill="#ffffff" opacity="0.6"/>
  </g>

  <g filter="url(#shadow)">
    <circle cx="385" cy="184" r="19" fill="url(#gemGrad)"/>
    <circle cx="379" cy="178" r="5" fill="#ffffff" opacity="0.6"/>
  </g>

  <g filter="url(#shadow)">
    <circle cx="398" cy="256" r="22" fill="url(#goldGrad)"/>
    <circle cx="391" cy="249" r="6" fill="#ffffff" opacity="0.75"/>
  </g>

  <g filter="url(#shadow)">
    <circle cx="385" cy="328" r="19" fill="url(#gemGrad)"/>
    <circle cx="379" cy="322" r="5" fill="#ffffff" opacity="0.6"/>
  </g>

  <g filter="url(#shadow)">
    <circle cx="327" cy="379" r="19" fill="url(#gemGrad)"/>
    <circle cx="321" cy="373" r="5" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Bottom Apex Gold Bead -->
  <g filter="url(#shadow)">
    <circle cx="256" cy="398" r="24" fill="url(#goldGrad)"/>
    <circle cx="248" cy="390" r="7" fill="#ffffff" opacity="0.75"/>
  </g>

  <g filter="url(#shadow)">
    <circle cx="185" cy="379" r="19" fill="url(#gemGrad)"/>
    <circle cx="179" cy="373" r="5" fill="#ffffff" opacity="0.6"/>
  </g>

  <g filter="url(#shadow)">
    <circle cx="127" cy="328" r="19" fill="url(#gemGrad)"/>
    <circle cx="121" cy="322" r="5" fill="#ffffff" opacity="0.6"/>
  </g>

  <g filter="url(#shadow)">
    <circle cx="114" cy="256" r="22" fill="url(#goldGrad)"/>
    <circle cx="107" cy="249" r="6" fill="#ffffff" opacity="0.75"/>
  </g>

  <g filter="url(#shadow)">
    <circle cx="127" cy="184" r="19" fill="url(#gemGrad)"/>
    <circle cx="121" cy="178" r="5" fill="#ffffff" opacity="0.6"/>
  </g>

  <g filter="url(#shadow)">
    <circle cx="185" cy="133" r="19" fill="url(#gemGrad)"/>
    <circle cx="179" cy="127" r="5" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- High-End Refined Geometric Star Emblem (Centerpiece) -->
  <g filter="url(#goldGlow)">
    <path d="M 256 218 L 264 248 L 294 256 L 264 264 L 256 294 L 248 264 L 218 256 L 248 248 Z" fill="url(#goldGrad)"/>
    <path d="M 256 232 L 261 251 L 280 256 L 261 261 L 256 280 L 251 261 L 232 256 L 251 251 Z" fill="#ffffff" opacity="0.4"/>
  </g>
</svg>