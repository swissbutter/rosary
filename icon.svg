<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#142436"/>
      <stop offset="70%" stop-color="#080e18"/>
      <stop offset="100%" stop-color="#04070c"/>
    </radialGradient>
    <radialGradient id="jadeGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#48c9b0"/>
      <stop offset="60%" stop-color="#16a085"/>
      <stop offset="100%" stop-color="#0b5345"/>
    </radialGradient>
    <radialGradient id="goldGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fff5a0"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#996500"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10.24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5.12" stdDeviation="7.68" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="225.28" fill="url(#bgGrad)" stroke="rgba(212, 175, 55, 0.65)" stroke-width="10.24"/>

  <!-- Beads -->
  <circle cx="256.0" cy="112.6" r="23.0" fill="url(#goldGrad)" filter="url(#dropShadow)"/><circle cx="249.1" cy="105.7" r="5.8" fill="rgba(255,255,255,0.75)"/><circle cx="331.2" cy="137.1" r="23.0" fill="url(#goldGrad)" filter="url(#dropShadow)"/><circle cx="324.3" cy="130.2" r="5.8" fill="rgba(255,255,255,0.75)"/><circle cx="377.7" cy="201.1" r="23.0" fill="url(#goldGrad)" filter="url(#dropShadow)"/><circle cx="370.8" cy="194.2" r="5.8" fill="rgba(255,255,255,0.75)"/><circle cx="377.7" cy="280.2" r="23.0" fill="url(#goldGrad)" filter="url(#dropShadow)"/><circle cx="370.8" cy="273.3" r="5.8" fill="rgba(255,255,255,0.75)"/><circle cx="331.2" cy="344.2" r="23.0" fill="url(#jadeGrad)" filter="url(#dropShadow)"/><circle cx="324.3" cy="337.3" r="5.8" fill="rgba(255,255,255,0.75)"/><circle cx="256.0" cy="368.6" r="23.0" fill="url(#jadeGrad)" filter="url(#dropShadow)"/><circle cx="249.1" cy="361.7" r="5.8" fill="rgba(255,255,255,0.75)"/><circle cx="180.8" cy="344.2" r="23.0" fill="url(#jadeGrad)" filter="url(#dropShadow)"/><circle cx="173.9" cy="337.3" r="5.8" fill="rgba(255,255,255,0.75)"/><circle cx="134.3" cy="280.2" r="23.0" fill="url(#jadeGrad)" filter="url(#dropShadow)"/><circle cx="127.4" cy="273.3" r="5.8" fill="rgba(255,255,255,0.75)"/><circle cx="134.3" cy="201.1" r="23.0" fill="url(#jadeGrad)" filter="url(#dropShadow)"/><circle cx="127.4" cy="194.2" r="5.8" fill="rgba(255,255,255,0.75)"/><circle cx="180.8" cy="137.1" r="23.0" fill="url(#jadeGrad)" filter="url(#dropShadow)"/><circle cx="173.9" cy="130.2" r="5.8" fill="rgba(255,255,255,0.75)"/>

  <!-- Cross -->
  <g filter="url(#glow)">
    <rect x="247.04" y="322.56" width="17.92" height="92.16" rx="3.5840000000000005" fill="url(#goldGrad)"/>
    <rect x="225.28" y="350.20799999999997" width="61.44" height="17.92" rx="3.5840000000000005" fill="url(#goldGrad)"/>
  </g>
</svg>